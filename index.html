<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozy Builder & Asset Library</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #8ecae6; }
        #root { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .ui-layer { pointer-events: auto; }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 0px; height: 0px; } /* Hidden scrollbar for cleaner look */
        
        /* Animations */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
    </style>
    
    <!-- Import Map for Modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
            "cannon-es": "https://esm.sh/cannon-es@0.20.0",
            "idb": "https://esm.sh/idb@8.0.0",
            "uuid": "https://esm.sh/uuid@9.0.1",
            "framer-motion": "https://esm.sh/framer-motion@10.16.4",
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "htm": "https://esm.sh/htm@3.1.1"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="root">
        <!-- Fallback loader -->
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.8); font-size: 24px; pointer-events: none;">
            Loading Builder...
        </div>
    </div>
